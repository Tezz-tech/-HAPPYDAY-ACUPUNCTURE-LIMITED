name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Copy and content checks
        run: npm run check:todos
      - name: Unit and API tests
        run: npm test
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Build web (prerender and copy check)
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npx playwright test

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - name: Serve the built site
        run: npx --yes http-server web/build/client -p 4173 -s &
      - name: Lighthouse CI (fails below the budgets in lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.0 autorun

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, lighthouse]
    steps:
      - run: echo "Deploy is configured in DEPLOY.md (Cloudflare Pages and the API host connect to this repository directly)."
